name: EC Pulse Patrol AI

on:
  push:
    branches:
      - main
      - feat/ec-pulse-patrol-ai
    paths:
      - "scripts/ec_pulse_patrol.py"
      - ".github/workflows/ec-pulse-patrol-ai.yml"
      - "plugins/ec-pulse/**"
      - "app/**"
      - "tests/**"
      - "docs/legal/**"
      - "vercel.json"
      - ".gitignore"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ec-pulse-patrol-ai
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Patrol and safe self-repair
        id: patrol
        shell: bash
        run: |
          set +e
          python scripts/ec_pulse_patrol.py --repair > patrol.json
          status=$?
          set -e
          cat patrol.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '### EC Pulse Patrol AI'
            echo
            cat patrol.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run plugin tests
        run: python -m unittest discover -s plugins/ec-pulse/tests -v

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Check patch hygiene
        run: git diff --check

      - name: Publish repair PR or issue
        env:
          GH_TOKEN: ${{ github.token }}
          PATROL_STATUS: ${{ steps.patrol.outputs.status }}
        shell: bash
        run: |
          set -e
          if ! git diff --quiet; then
            branch="patrol/repair-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply EC Pulse patrol repairs"
            git push --set-upstream origin "$branch"
            gh pr create --base main --head "$branch" --title "chore: EC Pulse Patrol AI repairs" --body "Automated by EC Pulse Patrol AI. Safe mechanical repairs were applied and repository tests passed. This PR is intentionally not auto-merged. See the workflow run summary for findings."
          elif [ "$PATROL_STATUS" != "0" ]; then
            gh issue create --title "[Patrol AI] unresolved EC Pulse repository issue" --body-file patrol.json
            exit 1
          else
            echo "No repair required."
          fi
