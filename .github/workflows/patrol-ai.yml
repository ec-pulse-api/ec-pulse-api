name: EC Pulse Patrol AI
# Autonomous security/reliability patrol: scheduled + PR-triggered, with safe repair/reporting.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/ec-pulse/**"
      - ".claude-plugin/**"
      - ".github/workflows/**"
      - "docs/**"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ec-pulse-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run deterministic safety checks
        id: deterministic
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "=== compileall ==="
            python -m compileall -q plugins/ec-pulse
            echo "=== unit tests ==="
            python -m unittest discover -s plugins/ec-pulse/tests -v
          } 2>&1 | tee patrol-deterministic.log

      - name: Run self-contained Patrol AI
        id: patrol
        run: |
          set -o pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-report.json

      - name: Re-audit after repair
        id: reaudit
        run: |
          set -o pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-reaudit.json
          if grep -q '"status": "FAIL"' patrol-reaudit.json; then
            echo "::error::Patrol re-audit failed"
            exit 1
          fi

      - name: Publish patrol report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          initial = Path('patrol-report.json').read_text() if Path('patrol-report.json').exists() else '{"status":"NOT_VERIFIED"}'
          reaudit = Path('patrol-reaudit.json').read_text() if Path('patrol-reaudit.json').exists() else '{"status":"NOT_VERIFIED"}'
          body = '## EC Pulse Patrol AI report\n\nSelf-contained patrol executed without an external AI credential.\n\n### Initial patrol\n```json\n' + initial + '\n```\n\n### Re-audit\n```json\n' + reaudit + '\n```'
          Path('patrol-issue-body.md').write_text(body)
          PY
          gh issue create --title "Patrol AI report" --body-file patrol-issue-body.md
