name: EC Pulse Patrol AI
# Autonomous security/reliability patrol: scheduled + PR-triggered, with safe repair/reporting.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/ec-pulse/**"
      - ".claude-plugin/**"
      - ".github/workflows/**"
      - "docs/**"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: ec-pulse-patrol
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run deterministic safety checks
        id: deterministic
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "=== compileall ==="
            python -m compileall -q plugins/ec-pulse
            echo "=== unit tests ==="
            python -m unittest discover -s plugins/ec-pulse/tests -v
          } 2>&1 | tee patrol-deterministic.log

      - name: Run self-contained Patrol AI
        id: patrol
        run: |
          set -o pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-report.json

      - name: Re-audit after repair
        id: reaudit
        run: |
          set -o pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-reaudit.json
          if grep -q '"status": "FAIL"' patrol-reaudit.json; then
            echo "::error::Patrol re-audit failed"
            exit 1
          fi

      - name: Publish patrol report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="## EC Pulse Patrol AI report

          Self-contained patrol executed without requiring an external AI credential.

          ### Initial patrol
          ```json
          $(cat patrol-report.json 2>/dev/null || echo '{"status":"NOT_VERIFIED"}')
          ```

          ### Re-audit
          ```json
          $(cat patrol-reaudit.json 2>/dev/null || echo '{"status":"NOT_VERIFIED"}')
          ```"
          gh issue create --title "Patrol AI report" --body "$body"
