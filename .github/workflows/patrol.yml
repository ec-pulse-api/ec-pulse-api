name: EC Pulse AI Patrol

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ec_pulse_patrol.py'
      - '.github/workflows/patrol.yml'
      - 'plugins/ec-pulse/**'
      - '.claude-plugin/marketplace.json'
      - 'docs/legal/**'
      - '.gitignore'

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run autonomous patrol and repair
        run: |
          set -euo pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("patrol-report.json").read_text(encoding="utf-8"))
          status = report.get("status")
          print("patrol status:", status)
          print("repairs:", report.get("repairs", []))
          print("failures:", report.get("failures", []))
          if status == "FAIL":
              raise SystemExit(1)
          PY

      - name: Upload patrol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec-pulse-patrol-report
          path: patrol-report.json
          if-no-files-found: ignore
