name: EC Pulse AI Patrol

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ec_pulse_patrol.py'
      - '.github/workflows/patrol.yml'
      - 'plugins/ec-pulse/**'
      - '.claude-plugin/marketplace.json'
      - 'docs/legal/**'
      - '.gitignore'

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repository patrol
        run: |
          set -euo pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-report.json
          python -c 'import json; x=json.load(open("patrol-report.json", encoding="utf-8")); print("repository patrol status:", x.get("status")); print("repairs:", x.get("repairs", [])); print("failures:", x.get("failures", [])); raise SystemExit(1 if x.get("status") == "FAIL" else 0)'

      - name: Check production health
        env:
          BACKEND_URL: ${{ secrets.EC_PULSE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL}" ]; then
            echo "EC_PULSE_API_URL is not configured; production health check is NOT VERIFIED."
            exit 0
          fi
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 30 "${BACKEND_URL%/}/health"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "health check failed (attempt ${attempt}/3); retrying..." >&2
              sleep 5
            fi
          done
          echo "production health check could not be verified." >&2
          exit 0

      - name: Run production AI patrol
        env:
          BACKEND_URL: ${{ secrets.EC_PULSE_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Production AI patrol is NOT VERIFIED: EC_PULSE_API_URL or CRON_SECRET is not configured."
            exit 0
          fi
          response=$(curl --fail-with-body --silent --show-error --max-time 120             -H "Authorization: Bearer ${CRON_SECRET}"             "${BACKEND_URL%/}/api/cron/patrol")
          echo "${response}" > runtime-patrol-report.json
          python -c 'import json; x=json.load(open("runtime-patrol-report.json", encoding="utf-8")); print("runtime patrol ok:", x.get("ok")); print("repairs:", x.get("repairs", [])); print("failures:", x.get("failures", [])); raise SystemExit(0 if x.get("ok") else 1)'

      - name: Upload patrol reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec-pulse-patrol-report
          path: |
            patrol-report.json
            runtime-patrol-report.json
          if-no-files-found: ignore
