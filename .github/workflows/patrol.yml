name: EC Pulse AI Patrol

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ec_pulse_patrol.py'
      - '.github/workflows/patrol.yml'
      - 'plugins/ec-pulse/**'
      - '.claude-plugin/marketplace.json'
      - 'docs/legal/**'
      - '.gitignore'

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run repository patrol
        run: |
          set -euo pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-report.json
          python -c 'import json; x=json.load(open("patrol-report.json", encoding="utf-8")); print("repository patrol status:", x.get("status")); print("repairs:", x.get("repairs", [])); print("failures:", x.get("failures", [])); raise SystemExit(1 if x.get("status") == "FAIL" else 0)'

      - name: Check production health
        env:
          BACKEND_URL: ${{ secrets.EC_PULSE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL}" ]; then
            printf '%s\n' '{"status":"SKIPPED","reason":"EC_PULSE_API_URL is not configured"}' > health-report.json
            echo "Production health check SKIPPED: EC_PULSE_API_URL is not configured."
            exit 0
          fi

          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error --max-time 30 \
              "${BACKEND_URL%/}/health" >/dev/null; then
              printf '{"status":"PASS","attempt":%s}\n' "${attempt}" > health-report.json
              echo "Production health check passed on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Health check failed (attempt ${attempt}/3); retrying in 5 seconds..." >&2
              sleep 5
            fi
          done

          printf '%s\n' '{"status":"FAIL","reason":"health_check_failed_after_3_attempts"}' > health-report.json
          echo "Production health check failed after 3 attempts." >&2
          exit 1

      - name: Run production AI patrol
        env:
          BACKEND_URL: ${{ secrets.EC_PULSE_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            printf '%s\n' '{"ok":false,"status":"SKIPPED","reason":"EC_PULSE_API_URL or CRON_SECRET is not configured"}' > runtime-patrol-report.json
            echo "Production AI patrol SKIPPED: EC_PULSE_API_URL or CRON_SECRET is not configured."
            exit 0
          fi

          if ! response=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BACKEND_URL%/}/api/cron/patrol"); then
            printf '%s\n' '{"ok":false,"status":"FAIL","reason":"production_patrol_request_failed"}' > runtime-patrol-report.json
            echo "Production AI patrol request failed." >&2
            exit 1
          fi

          printf '%s\n' "${response}" > runtime-patrol-report.json
          python -c 'import json; x=json.load(open("runtime-patrol-report.json", encoding="utf-8")); print("runtime patrol status:", x.get("status", "UNKNOWN")); print("runtime patrol ok:", x.get("ok")); print("repairs:", x.get("repairs", [])); print("failures:", x.get("failures", [])); raise SystemExit(0 if x.get("ok") is True else 1)'

      - name: Upload patrol reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec-pulse-patrol-report
          path: |
            patrol-report.json
            health-report.json
            runtime-patrol-report.json
          if-no-files-found: ignore
