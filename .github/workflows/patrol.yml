name: EC Pulse AI Patrol

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ec_pulse_patrol.py'
      - '.github/workflows/patrol.yml'
      - 'plugins/ec-pulse/**'
      - '.claude-plugin/marketplace.json'
      - 'docs/legal/**'
      - '.gitignore'

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run autonomous patrol and repair
        run: |
          set -euo pipefail
          python scripts/ec_pulse_patrol.py | tee patrol-report.json
          python -c 'import json; x=json.load(open("patrol-report.json", encoding="utf-8")); print("patrol status:", x.get("status")); print("repairs:", x.get("repairs", [])); print("failures:", x.get("failures", [])); raise SystemExit(1 if x.get("status") == "FAIL" else 0)'

      - name: Upload patrol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec-pulse-patrol-report
          path: patrol-report.json
          if-no-files-found: ignore
